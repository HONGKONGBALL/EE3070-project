[project]
name = "navigation-24h"
version = "0.1.0"
description = "Navigation implementation, replay and evidence tools"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.16,<1", "rich>=14,<15", "pyserial>=3.5,<4", "httpx2[http2,brotli,zstd]>=2.16,<3", "jsonschema>=4.25,<5"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "basedpyright>=1.34,<2", "cmake>=4.1,<5", "ninja>=1.13,<2"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["tools", "tests/python"]
exclude = ["**/__pycache__", ".toolchain", ".venv", "build", "firmware"]
reportUnusedCallResult = "warning"
# Exhaustive variant switches retain an assert_never branch for future variants.
reportUnnecessaryComparison = "none"
executionEnvironments = [
  {root = "tools"},
  {root = "tests/python", extraPaths = ["tools"]},
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D", "INP001"]
"tools/**/*.py" = ["T201", "INP001", "EXE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-returns = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
pythonpath = ["tools"]
