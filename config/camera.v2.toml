[vision]
# Ground skips the object model. Use --mode balanced to run the previous combined demo.
mode = "ground"

[server]
host = "127.0.0.1"
port = 8000
preview_fps = 12

[camera]
device = "auto"
width = 640
height = 480
fps = 15

[model]
directory = "models/yolo11n"
size = 416
confidence = 0.45
threads = 1
max_fps = 6

[road]
directory = "models/v2/road-distress"
size = 416
confidence = 0.4
threads = 1
max_fps = 1.5

[pothole]
backend = "yolox_ncnn_research"
directory = "models/v2/pothole-yolox-research"
size = 640
confidence = 0.6
threads = 1
max_fps = 1.5

[puddle]
enabled = true
directory = "models/v2/puddle-calibrated"
size = 640
confidence = 0.25
threads = 1
max_fps = 1.5

[semantic]
directory = "models/v2/segformer"
stair_context_directory = "models/v2/stairs-context"
size = 384
confidence = 0.55
threads = 1
max_fps = 1.5

[warning]
roi = [[0.25,0.25],[0.75,0.25],[0.95,1.0],[0.05,1.0]]
ground_roi = [[0.35,0.40],[0.65,0.40],[0.95,1.0],[0.05,1.0]]
cooldown_s = 8.0

[distance]
mode = "none"
enter_m = 1.0
leave_m = 1.2
script = "config/scenarios/approach.json"
# Real Pico mode must explicitly configure its actual port and mounting direction.
port = "/dev/serial/by-id/CONFIRM_PICO_DEVICE"
direction = "unknown"
calibration_id = ""

[association]
verified = false
source = "none"
id = ""
beam_roi = []

[audio]
ordinary_interval_s = 1.5
enabled = true
directory = "audio/en"
target = ""

# Independent admitted observations, not consecutive captures. No extra inference.
[warning.confirmation.possible_puddle]
hits = 2
observations = 3
window_s = 3.2
min_span_s = 0.3
[warning.confirmation.damaged_pavement]
hits = 2
observations = 3
window_s = 3.2
min_span_s = 0.3
[warning.confirmation.pothole]
hits = 2
observations = 2
window_s = 3.2
min_span_s = 0.3
[warning.confirmation.stairs]
hits = 2
observations = 3
window_s = 3.2
min_span_s = 0.3
[warning.episodes.wet_surface]
clear_hits = 6
clear_span_s = 5.0
missing_reset_s = 10.0
[warning.episodes.damaged_pavement]
clear_hits = 3
clear_span_s = 1.5
missing_reset_s = 6.0
[warning.episodes.stairs]
clear_hits = 4
clear_span_s = 3.0
missing_reset_s = 6.0
[warning.pothole_urgency]
confidence = 0.75
image_area = 0.01
# Image evidence thresholds do not measure physical depth or distance.
[warning.phrases.possible_puddle]
id = "puddle_ahead"
text = "Possible wet pavement ahead."
[warning.phrases.damaged_pavement]
id = "damaged_pavement"
text = "Possible damaged pavement ahead."
[warning.phrases.pothole]
id = "pothole_ahead"
text = "Possible pothole ahead."
[warning.phrases.stairs]
id = "stairs_ahead"
text = "Possible stairs ahead."
